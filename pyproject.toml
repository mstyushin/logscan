[project]
name = "logscan"
version = "0.1.0"
description = "Scrape log for suspicious IPs/hashes and generate a report."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=22.8",
    "requests>=2.28.0",
]

[dependency-groups]
dev = [
    "anyio>=4.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "responses>=0.25.0",
]

[project.scripts]
logscan = "logscan:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
